; Basilauncher bootloader: stock ESP-IDF 5.5 second stage + a hook that sends a
; deliberate reset (RST button, power-on, USB reset) back to the factory hub.
; The app built here is a stub; only .pio/build/bootloader/bootloader.bin is used.
;   pio run            -> build
;   pio run -t flashbl -> write bootloader.bin at 0x0 (see extra_script)

[platformio]
default_envs = bootloader

[env:bootloader]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = espidf
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.partitions = ../partitions.csv
board_upload.flash_size = 16MB
extra_scripts = post:flash_bootloader.py
