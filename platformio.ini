; Basilauncher — reboot-gated firmware hub for LilyGO T5 E-Paper S3 Pro.
; Display path: BoardT5S3 + FreeInk LgfxEpd + M5GFX
; (not FastEPD — FastEPD's BB_PANEL_LILYGO_T5PRO drives GPIO11/BL_EN as data).
; Build:  pio run -e basilauncher
; Flash:  pio run -e basilauncher -t upload

[platformio]
default_envs = basilauncher

[env:basilauncher]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; Always write into the factory slot (0x10000). With factory+ota partitions,
; PlatformIO's default upload targets ota_0 instead — wrong for the hub.
upload_protocol = esptool
; Write factory only, then wipe otadata so boot lands on Basilauncher.
; Arduino's stock boot_app0.bin actually selects ota_0 (seq=1) — wrong for a
; factory hub. Guest apps live in ota_0..ota_3 and are never touched by this upload.
upload_command = $UPLOADER --chip esp32s3 --port $UPLOAD_PORT --baud $UPLOAD_SPEED write-flash 0x10000 $SOURCE && $UPLOADER --chip esp32s3 --port $UPLOAD_PORT --baud $UPLOAD_SPEED erase-region 0xe000 0x2000

; Pin the Arduino 3.x core that pioarduino 55.03.311 expects (avoids picking up
; a leftover Arduino 2.x framework-arduinoespressif32 from older PlatformIO envs).
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11-libs.tar.xz

build_flags =
  -DFREEINK_DEVICE_LILYGO=1
  -DT5S3_HAS_LORA_GPS=1
  -DBOARD_HAS_PSRAM
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=1
  -DDISABLE_ALL_LIBRARY_WARNINGS
  -DBASILAUNCHER_VERSION=\"1.4.26\"
  -std=gnu++2a
  -Wl,--gc-sections

lib_deps =
  Wire
  SPI
  SD
  FS
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  BoardT5S3=symlink://freeink-sdk/libs/hardware/BoardT5S3
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  https://github.com/m5stack/M5GFX.git#0.2.20
